# Copy .env.example to .env first. Ports and origins come from the environment.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CHESS_TUTOR_FRONTEND_ORIGINS: >-
        ${CHESS_TUTOR_FRONTEND_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    ports:
      - "${CHESS_TUTOR_BACKEND_BIND:-127.0.0.1}:${CHESS_TUTOR_BACKEND_PORT:-8000}:8000"
    volumes:
      - chess_tutor_data:/data # SQLite database and Hugging Face model cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "${CHESS_TUTOR_FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  chess_tutor_data:
