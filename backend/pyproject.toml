[project]
name = "chess-tutor"
version = "0.1.0"
description = "Backend for the AI-assisted chess tutor"
readme = "../README.md"
authors = [
    { name = "Frank Bria", email = "136862992+frankbria@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "chess>=1.11.2",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-bdd>=9.0.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["maia: needs the real Maia-3 engine (scripts/install_maia3.sh)"]
addopts = "--cov=chess_tutor --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
