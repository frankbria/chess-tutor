name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
      - name: File hygiene hooks
        # Toolchain hooks run in the backend/frontend jobs; gitleaks ran above over full history.
        env:
          SKIP: gitleaks,ruff,black,mypy,eslint,typecheck
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Stockfish
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "STOCKFISH_PATH=$(command -v stockfish || echo /usr/games/stockfish)" >> "$GITHUB_ENV"
      - name: Cache Maia-3 install and weights
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/uv/tools/maia3
            ~/.local/bin/maia3-*
            ~/.cache/huggingface
          key: maia3-${{ runner.os }}-${{ hashFiles('scripts/install_maia3.sh') }}
      - name: Install Maia-3
        working-directory: .
        run: scripts/install_maia3.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run black --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
